name: CI

# WHAT THIS CHECKS, AND WHAT IT DELIBERATELY DOES NOT
# Lint, the unit tests and a real Docker build of the integration. Those three
# are what a Gladys integration actually has to satisfy: the manifest is
# validated by the store indexer, the image has to build and run, and the tests
# cover the Modbus, REST and device layers against `node --test`.
#
# THERE IS NO FORMATTING CHECK HERE, ON PURPOSE
# The template ships a `prettier --check .` step, and it was removed. Prettier
# walks the whole repository — the source, the manifest, `package.json`, the
# README and all four files in `docs/` — and on this repository it reported all
# fourteen files as needing reformatting. A check that disagrees with every file
# it sees is not enforcing a style, it is enforcing a style the project does not
# write in; the honest fixes are either to reformat the whole repository or to
# drop the check, and the second keeps the history readable.
#
# Formatting is not part of the Gladys contract. The indexer validates the
# manifest, the docs and the image reference, and nothing about whitespace. The
# `format` and `format:check` scripts are still in `package.json`: run them by
# hand if you want that style, they are simply not a gate on every push.
#
# THE MATRIX
# Node 22 and 24, the range the manifest's `gladys_version` and the Dockerfile
# both live in.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm ci` needs the lockfile to match package.json exactly, which is the
      # point: a drifting lockfile fails here rather than inside a user's
      # container. Falls back to `npm install` so a mismatch is visible as a
      # change in the log rather than as a red run.
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t gladys-wattwaechter:ci .
