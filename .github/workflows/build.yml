name: Build

# Multi-architecture build of the integration image.
#
# Two ways in: a version tag pushed by hand, or the Release workflow calling
# this one once it has bumped the version and created the tag. Both end with the
# same two tags on ghcr.io, `:X.Y.Z` and `:latest`.
#
# The `latest` tag is only moved for a real version tag, never for a branch
# build: a `latest` pointing at an unreleased commit would be offered to every
# Gladys user as an update.

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      version:
        description: Version being built and tagged
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
